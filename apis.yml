aid: koala-health
name: Koala Health
description: 'Koala Health is a digital pet pharmacy headquartered in Boston, Massachusetts
  that dispenses prescription medications, vitamins, supplements and veterinary diets
  for dogs and cats direct to pet parents, with an emphasis on chronic-condition medication
  management. Orders are packaged into date- and time-sorted pouches, refilled automatically,
  and prescriptions are fetched and verified directly with the pet parent''s veterinarian.
  Koala also runs KoalaVet, a clinic-facing platform that integrates with veterinary
  PIMS (practice information management systems) to sync client and patient records
  two-way, let clinic teams review, approve and submit prescriptions in a few clicks,
  and operate a branded managed online pharmacy for the practice. The company is a
  licensed non-resident pharmacy across US states, is LegitScript certified and .pharmacy
  (NABP) verified. Koala Health publishes no public developer API, developer portal
  or API documentation as of this profile; api.koala.health resolves to an internal
  Rails/Heroku administrative application behind sign-in.'
